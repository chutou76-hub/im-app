# Codemagic CI 配置（im-app-1 定制版专用，放仓库根目录）
# 本仓库根目录就是 Flutter 工程（pubspec.yaml 在根），无 monorepo 子目录，
# 所以不需要 working_directory——所有步骤默认都在仓库根执行。
#
# 签名方式：**App Store Connect API Key 自动签名**（2026-11-11 定稿）
#   构建时 `xcode-project use-profiles` 自动用 ASC 密钥向苹果
#   申请/下载 App Store 分发证书与描述文件并挂到工程上——
#   不需要手动上传 .p12 / .mobileprovision（网页 Code signing identities 保持空）。
#   缺证书时自动新建（Apple 每类分发证书上限 2 个，超限先去 ASC 删旧的）。
#
# 前置操作（Codemagic 网页，只需做一次）：
#   1. developer.apple.com → 用户和访问 → 集成(App Store Connect API) → 生成密钥
#      角色 App Manager，下载 .p8（只此一次），记下 Issuer ID / Key ID
#   2. Codemagic 网页 → Settings → Integrations → App Store Connect / Developer Portal → Connect
#      填 Issuer ID / Key ID / 上传 .p8，**API key name 必须填 siqu-asc**（与下面 integrations 一字不差）
#   3. Settings → codemagic.yaml settings → Code signing identities 保持为空（不要传 p12）

workflows:
  ios-ipa:
    name: iOS IPA (App Store)
    max_build_duration: 60

    integrations:
      app_store_connect: siqu-asc    # ← 必须和 Codemagic UI 里保存的集成名完全一致

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store             # TestFlight/上架必须 app_store
        bundle_identifier: com.siqu.chat         # 与 config/app_build.json 的 iosPackageName 一致
      vars:
        # App Store Connect → 你的 App → App 信息 → Apple ID（10 位数字）
        # 2026-11-11 用户确认：新开发者账号下 bundle id com.siqu.chat 的 App 记录
        APP_STORE_APP_ID: "6831744546"
        # Build Number 兜底基线：查不到 TestFlight 最新 build 时用「基线+构建次数」。
        # 与 config/app_build.json 的 versionCode(33) 对齐；正常情况走 TestFlight 实时查询
        BASE_BUILD_NUMBER: "33"
    scripts:
      - name: 拉取 Flutter 依赖
        script: |
          # 关 SPM：livekit_client 仅 CocoaPods，与 flutter_webrtc 的 SPM 迁移冲突
          flutter config --no-enable-swift-package-manager
          flutter packages pub get
      - name: 应用配置（名字/包名/接口/图标/启动图，读 config/app_build.json）
        script: dart run tool/apply_config.dart
        # ⚠ environment.bundle_identifier 与 app_build.json 的 iosPackageName
        #   必须同步改（签名按包名匹配描述文件，错一个字母都签不上）。
      - name: 挂载自动签名并打包 IPA
        script: |
          # 自动签名：用 ASC API Key 申请/下载 app_store 证书+描述文件挂到工程
          xcode-project use-profiles
          # use-profiles 把导出配置写到文件（本环境路径固定），而非 CM_EXPORT_OPTIONS 变量
          EXPORT_OPTS="${CM_EXPORT_OPTIONS:-/Users/builder/export_options.plist}"

          # Build Number 递增：Apple 拒绝重复 build 号。
          # 先查 TestFlight 当前最大值 +1；查不到（首建/网络/权限问题）就退回基线 + 构建次数。
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            LATEST=$((BASE_BUILD_NUMBER + PROJECT_BUILD_NUMBER))
          fi
          NEW_BUILD=$((LATEST + 1))
          echo "TestFlight 最新 build = $LATEST → 本次 build = $NEW_BUILD"

          flutter build ipa --release \
            --build-number="$NEW_BUILD" \
            --export-options-plist="$EXPORT_OPTS"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - fincqwe123@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration                 # 用上面 integrations 里声明的密钥认证
        # 只要这段存在，IPA 就会自动上传到 App Store Connect
        submit_to_testflight: true        # 上传后自动提交 TestFlight Beta 审核
        # 上传后自动附到「准备提交」的版本并提交 App Store 正式审核。
        # 前提：ASC 后台该 App 已建好待提交版本且截图/描述/隐私政策等元数据齐全
        #（首次元数据没配齐就先改成 false，只传 TestFlight，后台配好再开）
        submit_to_app_store: true
        # cancel_previous_submissions: true  # 提审新版时自动撤销旧版待审（可选）
        # beta_groups:                      # 过了 Beta 审核后自动分发给测试组
        #   - 内部测试组
