# -Xmx8G/MaxMetaspace 4G 会让 daemon 吃掉 ~3G 后仍需 3.2G 起 worker，
# 内存吃紧时 Gradle 无限循环等物理内存（WorkerDaemonExpiration 0 released），
# 表现为 build apk 永远卡住 → 降到 4G/1G + 限制并行 worker 数
# 2026-11-11 再降 4G→2G：用户机器页面文件被禁用（虚拟内存 0），可用物理内存
# 仅 ~7G 时 daemon（跑了 6h45m 的老进程）一接构建 C2 编译线程就 malloc 失败
# 崩溃（hs_err: out of physical RAM or swap space）。2G 堆 + workers.max=2
# 实测够本项目 release 构建；根治方案是用户开启 Windows 页面文件。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# 必须保持 false：本项目已把 AGP 降到 8.7.3（见 settings.gradle.kts），AGP 8 下没有
# "内置 Kotlin" 这个概念，Kotlin 一律由各插件自己 apply，false 才是正确值。
#
# 背景（两个插件对同一 flag 要求相反，单靠它无解，只能降 AGP）：
#   - AGP 9 + builtInKotlin=false → file_picker 11.0.3 从 AGP 版本号推断出
#     "isAgp9OrAbove" 就不挂 Kotlin 插件，而内置 Kotlin 又是关的 → 它的 .kt 没人编译 →
#     报 "找不到符号 com.mr.flutter.plugin.filepicker.FilePickerPlugin"。
#   - AGP 9 + builtInKotlin=true  → audioplayers_android 5.3.0 无条件 apply
#     'kotlin-android'，AGP 9 起禁止插件再自己挂 → 报
#     "The 'org.jetbrains.kotlin.android' plugin is no longer required ... since AGP 9.0"。
# 降到 AGP 8 后两者都走"插件自己 apply Kotlin"的同一条路，冲突消失。
android.builtInKotlin=false
# 关闭 R8 full mode：会裁掉 ML Kit 反射注册的组件，导致 release 包扫码崩溃
# （mobile_scanner 上游 issue #1722/#1725，与 app/proguard-rules.pro 双保险）
android.enableR8.fullMode=false

