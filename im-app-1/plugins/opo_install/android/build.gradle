plugins {
    id 'com.android.library'
}

group 'com.imapp.opoinstall'
version '1.0.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace 'com.imapp.opoinstall'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    // Opo 官方只发 jar（无 Maven 坐标），二进制随插件入库，不依赖外网
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
